<!doctype html>
<!-- Source for public/og-default.png (1200x630) and public/apple-touch-icon.png (180x180, open with #touch). Not shipped.
     Render after a build (the font is the build's Public Sans file), from the project root:
       chrome-headless-shell --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-default.png file://$PWD/scripts/og/og.html
       chrome-headless-shell --headless --hide-scrollbars --window-size=180,180 --screenshot=public/apple-touch-icon.png "file://$PWD/scripts/og/og.html#touch"
     The logo is the drawn mark from markSvg() in src/components/ui/icons.ts (see docs/brand/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/styles/tokens.css">
<style>
  @font-face { font-family: "Public Sans"; src: url("../../dist/_astro/fonts/5aeea5055500fab9.woff2") format("woff2"); font-weight: 400 700; }
  :root { --font-sans: "Public Sans"; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-sans-stack); -webkit-font-smoothing: antialiased; }
  .og { position: relative; width: 1200px; height: 630px; padding: 80px; }
  .lockup { display: flex; align-items: center; gap: 20px; }
  .lockup svg { width: 72px; height: 72px; }
  .word b { font-weight: 700; } .word .light { font-weight: 400; color: var(--muted); }
  .word { font-size: 52px; line-height: 72px; font-weight: 700; letter-spacing: -0.01em; }
  .tagline { margin-top: 56px; max-width: 900px; font-size: 40px; line-height: 52px; font-weight: 400; color: var(--muted); }
  .promise { position: absolute; left: 80px; bottom: 80px; font-size: 28px; line-height: 36px; font-weight: 700; color: #1A2142; }
  .plate { fill: var(--action); } .stroke { stroke: var(--on-action); }
  .touch { display: none; }
  body:has(.touch:target) .touch { display: block; }
  body:has(.touch:target) .og { display: none; }
  .touch svg { display: block; width: 180px; height: 180px; }
</style>
</head>
<body>
  <div class="og">
    <div class="lockup"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1A2142"/><mask id="om"><rect width="48" height="48" fill="#fff"/><circle cx="29.5" cy="12.5" r="8.6" fill="#000"/></mask><circle cx="23" cy="18" r="10.5" fill="#F2D27F" mask="url(#om)"/><path d="M12 37a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0" fill="none" stroke="#F2D27F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="word"><b>Bedtime</b> <span class="light">Calculator</span></span></div>
    <p class="tagline">Bedtimes and wake-up times that end a full sleep cycle.</p>
    <p class="promise">Free. No account, no app.</p>
  </div>
  <div class="touch" id="touch"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" fill="#1A2142"/><mask id="tm"><rect width="48" height="48" fill="#fff"/><circle cx="29.5" cy="12.5" r="8.6" fill="#000"/></mask><circle cx="23" cy="18" r="10.5" fill="#F2D27F" mask="url(#tm)"/><path d="M12 37a4 4 0 0 1 8 0a4 4 0 0 1 8 0a4 4 0 0 1 8 0" fill="none" stroke="#F2D27F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</body>
</html>
